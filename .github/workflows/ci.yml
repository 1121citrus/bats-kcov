name: CI

on:
  push:
    branches: [main, master, staging]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  ci:
    uses: 1121citrus/shared-github-workflows/.github/workflows/pipeline.yml@v1
    with:
      image: 1121citrus/bats-kcov
      test-mode: bats
      test-bats-files: |
        test/01-dockerfile.bats
        test/02-image-metadata.bats
        test/03-build.bats
        test/04-bats-coverage.bats
      smoke-enabled: true
      smoke-commands: |
        docker run --rm "${IMAGE}:${VERSION}" kcov --version
        docker run --rm "${IMAGE}:${VERSION}" bats --version
        docker run --rm "${IMAGE}:${VERSION}" jq --version
        docker inspect --format '{{json .Config.Entrypoint}}' "${IMAGE}:${VERSION}" | grep -Fx 'null'
        docker run --rm "${IMAGE}:${VERSION}" bash -c 'bats-coverage 2>&1 | grep -q "^Usage:"'
        docker run --rm "${IMAGE}:${VERSION}" bash --version
        docker run --rm --cap-add SYS_PTRACE --security-opt seccomp=unconfined -v "$PWD:/code:ro" -w /code "${IMAGE}:${VERSION}" bats-coverage --src /code --include /code/build,/code/bin/bats-coverage test/03-build.bats 2>&1 | grep -q 'Overall:'
    secrets: inherit
