# Grype scan configuration for bats-kcov.
#
# The gating scan (Stage 4b) blocks on CRITICAL/HIGH findings only
# (fail-on-severity: high).  The runtime image is built on Alpine 3.22
# (a supported release) via a multi-stage build; only the kcov binary and
# its verified runtime libraries (per ldd) are carried into the final image.
# python3, binutils, binutils-dev, and sqlite-libs from the kcov/kcov build
# stage are not present in the runtime image and do not appear in scan results.
#
# The single remaining CVE below has no fix in Alpine 3.22 at the current
# pinned digest.  Re-evaluate when either digest is updated.
#
# Documented in SECURITY.md §"Base image CVEs".

fail-on-severity: "high"

ignore:

  # busybox 1.37.x — no fix in Alpine 3.22; part of the Alpine base layer
  # and cannot be removed.  CVE-2025-60876 is Medium severity and does not
  # gate the build, but is listed here for completeness and auditing.
  - vulnerability: CVE-2025-60876
    package:
      name: busybox
      type: apk
  - vulnerability: CVE-2025-60876
    package:
      name: busybox-binsh
      type: apk
  - vulnerability: CVE-2025-60876
    package:
      name: ssl_client
      type: apk
